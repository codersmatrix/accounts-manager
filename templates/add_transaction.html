{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Add Transaction</h3>
                <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Account</label>
                        <select name="account_id" class="form-select" required>
                            {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.name }} (₹ {{ "%.2f"|format(acc.balance) }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="type" class="form-select" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" id="statusSelect" required>
                            <option value="completed">Completed (Paid / Received)</option>
                            <option value="pending">Pending (Need to pay later)</option>
                        </select>
                        <div class="form-text">
                            Pending transactions do <strong>not</strong> change your balance until you mark them as paid.
                        </div>
                    </div>
                    <div class="mb-3" id="dueDateField" style="display: none;">
                        <label class="form-label">Due Date (optional)</label>
                        <input type="date" name="due_date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="e.g. Electricity Bill, Rent" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control" placeholder="e.g. Bills, Rent, Food">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Transaction</button>
                    <a href="{{ url_for('transactions.transactions') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const statusSelect = document.getElementById('statusSelect');
    const dueDateField = document.getElementById('dueDateField');
    
    function toggleDueDate() {
        dueDateField.style.display = statusSelect.value === 'pending' ? 'block' : 'none';
    }
    statusSelect.addEventListener('change', toggleDueDate);
    toggleDueDate();
</script>
{% endblock %}
