{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Add Investment / SIP</h3>
                <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. HDFC Flexi Cap, Parag Parikh Flexi" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="inv_type" class="form-select">
                            <option value="mutual_fund">Mutual Fund (SIP)</option>
                            <option value="stocks">Stocks</option>
                            <option value="fd">Fixed Deposit</option>
                            <option value="ppf">PPF / EPF</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Monthly SIP / Autopay (₹)</label>
                            <input type="number" step="0.01" name="monthly_sip" class="form-control" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">SIP day (1–28)</label>
                            <input type="number" name="sip_day" class="form-control" value="5" min="1" max="28">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Already invested (₹)</label>
                            <input type="number" step="0.01" name="total_invested" class="form-control" value="0">
                            <div class="form-text">Cumulative amount so far</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start date (optional)</label>
                        <input type="date" name="start_date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="e.g. Groww, folio number…"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Investment</button>
                    <a href="{{ url_for('investments.investments') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
