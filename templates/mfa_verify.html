{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-3"><i class="bi bi-shield-check"></i> Authenticator code</h3>
                <p class="text-muted small">Enter the 6-digit code from your authenticator app for <strong>{{ username }}</strong>.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Code</label>
                        <input type="text" name="code" class="form-control form-control-lg text-center"
                               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
                               maxlength="6" required autofocus placeholder="000000">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link w-100 mt-2">Back to login</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
