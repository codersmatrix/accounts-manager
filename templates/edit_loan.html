{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Edit Loan – {{ loan.name }}</h3>
                <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Name / Lender</label>
                        <input type="text" name="name" class="form-control" value="{{ loan.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="lender_type" class="form-select">
                            {% for t, label in [('bank','Bank Loan'),('friend','Friend / Family'),('credit_card','Credit Card'),('other','Other')] %}
                            <option value="{{ t }}" {% if loan.lender_type == t %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">How will you repay?</label>
                        <select name="payment_mode" class="form-select" id="paymentMode">
                            <option value="emi" {% if (loan.payment_mode or 'emi') == 'emi' %}selected{% endif %}>Monthly EMI / installments</option>
                            <option value="one_time" {% if loan.payment_mode == 'one_time' %}selected{% endif %}>One-time / lump sum</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Original Principal (₹)</label>
                            <input type="number" step="0.01" name="principal" class="form-control" value="{{ loan.principal }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Outstanding (₹)</label>
                            <input type="number" step="0.01" name="outstanding" class="form-control" value="{{ loan.outstanding }}">
                        </div>
                    </div>
                    <div class="row" id="emiFields">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">EMI / Min. due (₹)</label>
                            <input type="number" step="0.01" name="emi_amount" class="form-control" value="{{ loan.emi_amount }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">EMI due day (1–28)</label>
                            <input type="number" name="emi_day" class="form-control" value="{{ loan.emi_day }}" min="1" max="28">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Interest % p.a.</label>
                            <input type="number" step="0.01" name="interest_rate" class="form-control" value="{{ loan.interest_rate }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start date</label>
                        <input type="date" name="start_date" class="form-control" value="{{ loan.start_date.isoformat() if loan.start_date else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active" {% if loan.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="paid_off" {% if loan.status == 'paid_off' %}selected{% endif %}>Paid Off</option>
                        </select>
                    </div>
                    <div class="row" id="tenureFields">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Balance tenure</label>
                            <input type="number" name="tenure_value" class="form-control" min="0" max="600"
                                   step="1" placeholder="e.g. 24"
                                   value="{{ loan.tenure_value if loan.tenure_value is not none else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit</label>
                            <select name="tenure_unit" class="form-select">
                                <option value="months" {% if (loan.tenure_unit or 'months') == 'months' %}selected{% endif %}>Months</option>
                                <option value="years" {% if loan.tenure_unit == 'years' %}selected{% endif %}>Years</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-text mb-3">Remaining tenure left to pay (optional).</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2">{{ loan.notes }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('loans.loan_detail', loan_id=loan.id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function togglePaymentMode() {
    document.getElementById('emiFields').style.display =
        document.getElementById('paymentMode').value === 'emi' ? '' : 'none';
}
document.getElementById('paymentMode').addEventListener('change', togglePaymentMode);
togglePaymentMode();
</script>
{% endblock %}
