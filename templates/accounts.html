{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Accounts</h2>
    <a href="{{ url_for('add_account') }}" class="btn btn-primary">+ Add Account</a>
</div>

<div class="row">
    {% for acc in accounts %}
    <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ acc.name }}</h5>
                <p class="text-muted mb-1">{{ acc.account_type }}</p>
                <h3 class="{% if acc.balance >= 0 %}text-success{% else %}text-danger{% endif %}">
                    ₹ {{ "%.2f"|format(acc.balance) }}
                </h3>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-info">No accounts found. Create your first account!</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
