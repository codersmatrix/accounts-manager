{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Add New Account</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Account Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. HDFC Savings" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Account Type</label>
                        <select name="account_type" class="form-select">
                            <option>Bank</option>
                            <option>Cash</option>
                            <option>Credit Card</option>
                            <option>Wallet</option>
                            <option>Investment</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Opening Balance (₹)</label>
                        <input type="number" step="0.01" name="balance" class="form-control" value="0">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                    <a href="{{ url_for('accounts.accounts') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
