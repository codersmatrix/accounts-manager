{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">Set new password</h3>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">New password</label>
                        <input type="password" name="password" class="form-control" required maxlength="128" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm password</label>
                        <input type="password" name="confirm" class="form-control" required maxlength="128" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update password</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="{{ url_for('auth.login') }}">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
