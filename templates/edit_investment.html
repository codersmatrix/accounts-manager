{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Edit – {{ inv.name }}</h3>
                <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ inv.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select name="inv_type" class="form-select">
                            {% for t, label in [('mutual_fund','Mutual Fund'),('stocks','Stocks'),('fd','Fixed Deposit'),('ppf','PPF / EPF'),('other','Other')] %}
                            <option value="{{ t }}" {% if inv.inv_type == t %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Monthly SIP (₹)</label>
                            <input type="number" step="0.01" name="monthly_sip" class="form-control" value="{{ inv.monthly_sip }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">SIP day (1–28)</label>
                            <input type="number" name="sip_day" class="form-control" value="{{ inv.sip_day }}" min="1" max="28">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Total invested (₹)</label>
                            <input type="number" step="0.01" name="total_invested" class="form-control" value="{{ inv.total_invested }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start date</label>
                        <input type="date" name="start_date" class="form-control" value="{{ inv.start_date.isoformat() if inv.start_date else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active" {% if inv.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="stopped" {% if inv.status == 'stopped' %}selected{% endif %}>Stopped</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2">{{ inv.notes }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('investments.investment_detail', inv_id=inv.id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
